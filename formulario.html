<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>
    <h1>Formularios</h1>
    <p>Informacion necesaria para completar el formulario:</p>
    <form>
        <label> Nombre Completo:</label><br>
        <input type="text"><br><br>
        <label> Correo Electrónico:</label><br>
        <input type="email"><br><br>
        <label> Password:</label><br>
        <input type="password"><br><br>
        <label> Edad:</label><br>
        <input type="number"><br><br>
        <label> Fecha de Nacimiento:</label><br>
        <input type="date"><br><br>
        <label> Carrera:</label><br>
        <input type="text"><br><br>
        <label> Turno:</label><br>
        <input type="radio" name="Turno"> Mañana<br>
        <input type="radio" name="Turno"> Tarde<br>
        <input type="radio" name="Turno"> Noche<br><br>
        <label> Intereses:</label><br>
        <input type="checkbox"> Programacion<br>
        <input type="checkbox"> Base de Datos<br>
        <input type="checkbox"> Estadistica<br><br>
        <label> Comentarios:</label><br>
        <input type="text"><br><br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Eliminar">
    </form>
</body>
</html>
